name: Deploy

# Push to main → CI → image on GHCR → live on the VPS.
# Also runnable by hand from the Actions tab (e.g. to redeploy after an env change).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Same job the branches run, reused so nothing ships that would not have
  # passed a PR.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: build + push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - uses: actions/checkout@v5

      # GHCR paths must be lowercase; repository names need not be.
      - id: ref
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}/web" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.name }}:latest
          # NEXT_PUBLIC_* is inlined into the client bundle at build time, so it
          # cannot come from the server's .env like everything else does. Unset
          # secrets build an image with analytics off rather than failing.
          build-args: |
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
            NEXT_PUBLIC_POSTHOG_SESSION_RECORDING=${{ vars.NEXT_PUBLIC_POSTHOG_SESSION_RECORDING }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER_NAME: ${{ secrets.VPS_USER }}
          HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          port="${PORT:-22}"

          # Pin the host key when it is stored as a secret; otherwise trust the
          # first scan. Setting VPS_SSH_HOST_KEY is what makes this deploy
          # resistant to a man-in-the-middle — see DEPLOY.md.
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_SSH_HOST_KEY is not set — trusting the scanned host key"
            ssh-keyscan -p "$port" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<EOF
          Host pando-vps
            HostName $HOST
            User $USER_NAME
            Port $port
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Pull and restart
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Values go in as shell assignments ahead of the committed script and
          # travel over stdin, so no secret lands in the remote process list.
          {
            printf 'IMAGE=%q\n' "$IMAGE"
            printf 'APP_DIR=%q\n' "$APP_DIR"
            printf 'GHCR_USER=%q\n' "$GHCR_USER"
            printf 'GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
            cat .github/scripts/remote-deploy.sh
          } | ssh pando-vps 'bash -s'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
